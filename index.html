<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8f5">
  <meta name="description" content="栖伴 — 一个记得你、陪伴你，和你一起成长的伙伴。四端陪伴 Agent 交互原型。">
  <title>栖伴 · 让成长，有个伴</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./pets.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="./cloud.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="app-shell" id="app">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#home" aria-label="栖伴首页"><img src="./assets/mark.svg" alt=""><span>栖伴<span class="brand-en">QIBAN</span></span></a>
      <div class="space-label">你的陪伴空间</div>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom">
        <div class="quiet-card"><span class="quiet-symbol">◌</span><span><strong>给自己一点留白</strong><small>慢一点，也在向前。</small></span></div>
        <button id="settings-button" class="profile-button"><span class="profile-avatar">我</span><span><strong>我的空间</strong><small>个人陪伴空间</small></span><span data-icon="settings"></span></button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb"><span class="mobile-brand">栖伴</span><span id="breadcrumb">陪伴时刻</span><span class="breadcrumb-divider">/</span><span id="date-label"></span></div><div class="topbar-actions"><button class="cloud-button" id="cloud-button">连接 AI</button><span class="demo-badge">交互原型</span><button class="icon-button" id="theme-button" aria-label="切换深浅色" title="切换深浅色"><span data-icon="moon"></span></button><button class="icon-button" id="mobile-button" aria-label="切换手机预览" title="切换手机预览"><span data-icon="phone"></span></button></div></header>
      <div class="workspace-body"><main id="main" tabindex="-1"></main><aside class="conversation" aria-label="陪伴对话" id="conversation"></aside></div>
      <footer class="app-footer"><span><i class="status-dot"></i> 让每一个小小的改变，都被看见。</span><span>一个伙伴，随你去往每一端 <span data-icon="sparkles"></span></span></footer>
    </div>
    <nav class="mobile-nav" id="mobile-navigation" aria-label="手机导航"></nav>
  </div>
  <div id="toast" role="status" class="toast"></div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="floating-pet" hidden></div>
</body>
</html>
